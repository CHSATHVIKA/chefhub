<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book verified home chefs in your city for family dinners and small parties." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ChefHub - Home chefs, booked in minutes</title>
    <script>
      // if this page is from an older deploy its script file is gone, so reload once to get the new version
      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('chefhub-reloaded')) {
          sessionStorage.setItem('chefhub-reloaded', '1')
          location.reload()
        }
      }, true)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
