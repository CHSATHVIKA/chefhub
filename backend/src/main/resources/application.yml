spring:
  application:
    name: chefhub
  config:
    import: optional:file:./local.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chefhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:Y2hlZmh1Yi1sb2NhbC1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbg==}
    expiration-ms: 86400000
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
